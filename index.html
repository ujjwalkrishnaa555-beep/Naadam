<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naadam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>🎵 Naadam</h2>

  <a href="#">🏠 Home</a>
  <a href="#">🔍 Search</a>
  <a href="#">🎶 Playlists</a>
  <a href="#">❤️ Favorites</a>
</div>

<div class="main">

  <input type="text" placeholder="Search music...">

  <div class="hero">
    <h1>Welcome to Naadam</h1>
    <p>Kerala Inspired Royalty-Free Music</p>

    <button id="heroPlay">▶ Play Now</button>
  </div>

  <div class="cards">

    <div class="card">
      🌴 Backwater Beats
    </div>

    <div class="card">
      🌧️ Monsoon Memories
    </div>

    <div class="card">
      🥁 Kerala Folk
    </div>

  </div>

  <!-- floating badge added for the marked area -->
  <div class="floating-badge" id="infoBadge">☎</div>

</div>

<div class="player">
  <div class="now-playing">
    🎵 <span id="songTitle">No song playing</span>
  </div>

  <div>
    <button onclick="prevSong()">⏮</button>
    <button onclick="playPause()">▶ / ⏸</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <input type="range" id="progress" value="0">

  <audio id="audio"></audio>
</div>

<footer class="site-footer">
  <p style="text-align:center; font-size:0.95rem; margin:0.5rem 0 0">Created by: ujjwal Krishna</p>
  <p style="text-align:center; font-size:0.9rem; margin:0.25rem 0">Phone: <a href="tel:+918590921747">+91 85909 21747</a> &nbsp;|&nbsp; Email: <a href="mailto:ujjwalkrishna0555@gmail.com">ujjwalkrishna0555@gmail.com</a></p>
</footer>

<script src="Script.js" defer></script>
</body>
</html>
