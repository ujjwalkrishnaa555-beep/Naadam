<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naadam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>🎵 Naadam</h2>

  <a href="#">🏠 Home</a>
  <a href="#">🔍 Search</a>
  <a href="#">🎶 Playlists</a>
  <a href="#">❤️ Favorites</a>

  <!-- contact moved here (small orange text) -->
  <div class="contact">
    <p class="contact-name">Created by: ujjwal Krishna</p>
    <p class="contact-links">Phone: <a href="tel:+918590921747">+91 85909 21747</a><br>
    Email: <a href="mailto:ujjwalkrishna0555@gmail.com">ujjwalkrishna0555@gmail.com</a></p>
  </div>
</div>

<div class="main">

  <input type="text" placeholder="Search music...">

  <div class="hero">
    <h1>Welcome to Naadam</h1>
    <p>Kerala Inspired Royalty-Free Music</p>

    <button id="heroPlay">▶ Play Now</button>
  </div>

  <div class="cards">

    <div class="card">
      🌴 Backwater Beats
    </div>

    <div class="card">
      🌧️ Monsoon Memories
    </div>

    <div class="card">
      🥁 Kerala Folk
    </div>

  </div>

  <!-- floating badge added for the marked area (no phone icon) -->
  <div class="floating-badge" id="infoBadge">More</div>

</div>

<!-- Floating Player UI (replaces previous player bar) -->
<div class="music-player-bar">
  <div class="song-details">
    <img src="album-art.jpg" alt="Album Cover" class="album-art">
    <div class="track-info">
      <div class="song-title">Ehsaas</div>
      <div class="artist-name">Faheem Abdullah</div>
    </div>
  </div>

  <div class="player-controls">
    <button class="btn-icon device-btn">🖥️</button>
    <button class="btn-icon add-btn">+</button>
    <button class="btn-play-pause animated-pulse">
      ▶
    </button>
  </div>
</div>

<script src="Script.js" defer></script>
</body>
</html>
