<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naadam Music</title>

<link rel="stylesheet" href="./style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
    <h2>Naadam Music</h2>
    <p>Feel Every Beat 🎵</p>
</header>

<div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" placeholder="Search songs, artists...">
</div>

<section>
    <h3>🎧 Made For You</h3>
    <div class="card-row">
        <div class="card">Playlist 1</div>
        <div class="card">Playlist 2</div>
        <div class="card">Playlist 3</div>
    </div>
</section>

<section>
    <h3>🔥 Trending Now</h3>
    <div class="card-row">
        <div class="card">Song 1</div>
        <div class="card">Song 2</div>
        <div class="card">Song 3</div>
    </div>
</section>

<section>
    <h3>🆕 New Releases</h3>
    <div class="card-row">
        <div class="card">Album 1</div>
        <div class="card">Album 2</div>
        <div class="card">Album 3</div>
    </div>
</section>

<div class="mini-player">
    <span>🎵 Pookkal Pookkum</span>
    <i class="fas fa-play"></i>
</div>

<nav class="bottom-nav">
    <a href="#" class="active">
        <i class="fas fa-house"></i>
        <span>Home</span>
    </a>

    <a href="#">
        <i class="fas fa-magnifying-glass"></i>
        <span>Search</span>
    </a>

    <a href="#">
        <i class="fas fa-compass"></i>
        <span>Explore</span>
    </a>

    <a href="#">
        <i class="fas fa-book-open"></i>
        <span>Library</span>
    </a>

    <a href="#">
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </a>
</nav>

<script src="app.js"></script>

</body>
</html>
